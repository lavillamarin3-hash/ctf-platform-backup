# Producción: PostgreSQL y Redis son servicios nativos de LAB-DB-POSTGRES.
# Apache Guacamole y su base de datos se administran fuera de este Compose.
services:
  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?Configure DATABASE_URL in .env}
      REDIS_URL: ${REDIS_URL:?Configure REDIS_URL in .env}
      JWT_SECRET: ${JWT_SECRET:?Configure JWT_SECRET in .env}
      FIELD_HMAC_SECRET: ${FIELD_HMAC_SECRET:?Configure FIELD_HMAC_SECRET in .env}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Configure PUBLIC_ORIGIN in .env}
      # El usuario de ejecución no debe crear tablas ni datos de demostración.
      MANAGE_SCHEMA_ON_STARTUP: "false"
      CTF_SEED_DEMO_DATA: "false"
    restart: unless-stopped
    init: true
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-m", "app.check_services", "--http"]
      interval: 30s
      timeout: 20s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks: [ctf_internal]

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_BIND_IP:-10.10.10.13}:${WEB_PORT:-80}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks: [ctf_internal]

networks:
  ctf_internal:
    # No usar internal:true: la API necesita alcanzar 10.10.10.14 y Guacamole.
    driver: bridge

